# Dependabot configuration for Swan Match
# This enables automated security vulnerability PRs on GitHub
# Place this at: .github/dependabot.yml in BOTH repos

version: 2
updates:
  # Dart/Flutter packages (pubspec.yaml)
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "Harirajan06"
    labels:
      - "dependencies"
      - "flutter"

  # Cloud Functions npm packages (functions/package.json)
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "Harirajan06"
    labels:
      - "dependencies"
      - "cloud-functions"
