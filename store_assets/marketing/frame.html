<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Cinzel';src:url('file:///Users/apple/Downloads/Swan_Match_app-main/assets/fonts/Cinzel/Cinzel.ttf');font-weight:400 900;}
  @font-face{font-family:'Poppins';src:url('file:///Users/apple/Downloads/Swan_Match_app-main/store_assets/fonts/Poppins-SemiBold.ttf');font-weight:600;}
  @font-face{font-family:'Poppins';src:url('file:///Users/apple/Downloads/Swan_Match_app-main/store_assets/fonts/Poppins-Medium.ttf');font-weight:500;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;}
  body{
    background:
      radial-gradient(ellipse 1300px 820px at 50% -4%, rgba(150,118,44,0.60) 0%, rgba(70,55,20,0.55) 26%, rgba(20,16,8,0.85) 52%, #070707 72%),
      #070707;
    position:relative;font-family:'Poppins',sans-serif;
  }
  .corner{position:absolute;width:74px;height:74px;border-color:rgba(198,168,92,0.5);border-style:solid;border-width:0;}
  .tl{top:40px;left:40px;border-top-width:2px;border-left-width:2px;}
  .tr{top:40px;right:40px;border-top-width:2px;border-right-width:2px;}
  .bl{bottom:40px;left:40px;border-bottom-width:2px;border-left-width:2px;}
  .br{bottom:40px;right:40px;border-bottom-width:2px;border-right-width:2px;}
  .head{position:absolute;top:118px;left:0;width:100%;text-align:center;}
  .head h1{
    font-family:'Cinzel',serif;font-weight:700;font-size:74px;line-height:1.12;letter-spacing:2px;
    background:linear-gradient(135deg,#a08840 0%,#c6a85c 45%,#dec47e 72%,#c6a85c 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .rule{margin:30px auto 0;width:150px;height:2px;
    background:linear-gradient(90deg,transparent,#c6a85c,transparent);position:relative;}
  .rule::after{content:'';position:absolute;left:50%;top:-4px;width:9px;height:9px;background:#dec47e;transform:translateX(-50%) rotate(45deg);}
  .phone{
    position:absolute;left:50%;top:392px;transform:translateX(-50%);
    width:724px;height:1528px;overflow:hidden;
    border-radius:54px 54px 0 0;
    border:3px solid rgba(198,168,92,0.6);border-bottom:none;
    box-shadow:0 0 90px 10px rgba(198,168,92,0.18);
    background:#000;
  }
  .phone img{display:block;width:100%;}
  /* hero */
  .hero{position:absolute;inset:0;}
  .hero .img{position:absolute;inset:0;background-size:cover;background-position:center;}
  .hero .scrim{position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(7,7,7,0.55) 0%, rgba(7,7,7,0.15) 32%, rgba(7,7,7,0.55) 66%, rgba(7,7,7,0.96) 100%);}
  .hero .swan{position:absolute;top:150px;left:50%;transform:translateX(-50%);width:200px;height:200px;object-fit:contain;mix-blend-mode:screen;}
  .hero .wm{position:absolute;top:360px;left:0;width:100%;text-align:center;
    font-family:'Cinzel',serif;font-weight:700;font-size:96px;letter-spacing:12px;line-height:1.05;
    background:linear-gradient(135deg,#a08840,#c6a85c 50%,#dec47e 78%,#c6a85c);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 30px rgba(0,0,0,0.4);}
  .hero .tag{position:absolute;bottom:300px;left:0;width:100%;text-align:center;
    font-family:'Poppins';font-weight:500;}
  .hero .tag .l1{font-size:46px;color:#fff;letter-spacing:1px;}
  .hero .tag .l2{font-size:46px;color:#c6a85c;letter-spacing:1px;margin-top:6px;}
  .hero .sub{position:absolute;bottom:210px;left:0;width:100%;text-align:center;
    font-size:24px;letter-spacing:6px;text-transform:uppercase;color:rgba(255,255,255,0.6);}
</style></head>
